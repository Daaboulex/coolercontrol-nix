[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "coolerctl"
version = "0.1.0"
description = "CLI for CoolerControl daemon REST API"
requires-python = ">=3.10"
dependencies = ["click>=8.0", "requests>=2.28"]

[project.scripts]
coolerctl = "coolerctl:main"

[tool.setuptools]
packages = ["coolerctl"]
package-dir = { coolerctl = "." }
